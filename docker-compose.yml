version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: trading_bot_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: trading_bot
      MYSQL_USER: trading_user
      MYSQL_PASSWORD: trading123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf:/etc/mysql/conf.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - trading_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: trading_bot_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123456
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - trading_network

volumes:
  mysql_data:
    driver: local

networks:
  trading_network:
    driver: bridge 